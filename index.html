<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12303A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Galápagos 2027</title>
<style>
:root{--ink:#12303A;--bg:#F2F6F5;--blue:#1E6FD9;--red:#C8553D;--mute:#5B7279;--line:#C9D8D6;--sans:"Avenir Next","Segoe UI",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--ink);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 20px}
h1{margin:0;font-size:1.9rem;font-weight:700;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:#B9D0D3}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;font-size:.9rem}
#stato{display:flex;align-items:center;gap:6px;color:#B9D0D3}
#stato i{width:9px;height:9px;border-radius:50%;background:#7a8f94;display:inline-block}
#stato.on i{background:#4FD08A}#stato.off i{background:var(--red)}
main{max-width:720px;margin:0 auto;padding:8px 16px 40px}
ol{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:64px 1fr;border-bottom:1px solid var(--line)}
.d{padding:16px 8px 16px 0;text-align:right;color:var(--mute);font-size:.82rem;line-height:1.2}
.d b{display:block;font-size:1.6rem;color:var(--ink);font-weight:700}
li.oggi .d b{color:var(--red)}
details{padding:12px 0 12px 14px;border-left:3px solid var(--line)}
li.oggi details{border-left-color:var(--red)}
details[open]{border-left-color:var(--blue)}
summary{cursor:pointer;list-style:none;font-weight:600}
summary::-webkit-details-marker{display:none}
.riga{display:block;font-weight:400;color:var(--mute);font-size:.9rem;margin-top:2px}
label{display:block;margin-top:12px;font-size:.82rem;color:var(--mute)}
input,textarea{width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;font:inherit;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,summary:focus-visible,button:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.vuoto{padding:40px 8px;text-align:center}
button{background:var(--blue);color:#fff;border:0;border-radius:8px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
nav{display:flex;background:var(--ink);position:sticky;top:0;z-index:2}
nav button{flex:1;background:none;border-radius:0;border-bottom:3px solid transparent;color:#B9D0D3;padding:12px 0}
nav button[aria-selected=true]{color:#fff;border-bottom-color:var(--blue)}
.sec details{padding:12px 0 14px 14px;border-left:3px solid var(--line);border-bottom:1px solid var(--line);margin:0}
.sec details[open]{border-left-color:var(--blue)}
.del{background:none;color:var(--red);border:1px solid var(--red);margin-top:16px;padding:8px 14px}
.sec p{margin:14px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <h1>Galápagos 2027</h1>
  <p class="sub">23 aprile – 3 maggio</p>
  <div class="bar"><span id="conto"></span><span id="stato"><i></i><span>Connessione…</span></span></div>
</header>
<nav id="tab"><button data-t="programma" aria-selected="true">Programma</button><button data-t="voli" aria-selected="false">Voli</button><button data-t="alberghi" aria-selected="false">Alberghi</button></nav>
<main>
<section id="s-programma"><div id="lista" class="vuoto">Caricamento…</div></section>
<section id="s-voli" class="sec" hidden></section>
<section id="s-alberghi" class="sec" hidden></section>
</main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,setDoc,deleteDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDTzptxeE7uS4Cw-o0eCByhi7SErm6r0qM",authDomain:"galapagos-2027.firebaseapp.com",projectId:"galapagos-2027",storageBucket:"galapagos-2027.firebasestorage.app",messagingSenderId:"956902783176",appId:"1:956902783176:web:b91b5d0fd1833881844dfd"});
const db=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const col=collection(db,"giorni");

const SEED=[
["2027-04-23","Volo per Quito","07:35 volo per Madrid, scalo di 1h50. Arrivo a Quito alle 16:10 dello stesso giorno."],
["2027-04-24","Quito: TelefériQo e Mitad del Mundo","Mattina sul TelefériQo, quando il cielo è più limpido. Pomeriggio escursione alla Mitad del Mundo."],
["2027-04-25","Otavalo","Escursione al mercato artigianale indigeno di Otavalo."],
["2027-04-26","Centro Storico di Quito","Plaza Grande (Plaza de la Independencia), Chiesa della Compañía de Jesús (interni ricoperti d'oro) e complesso di San Francisco."],
["2027-04-27","Volo a Baltra e Puerto Ayora","Avianca AV1688: Quito 09:15, Baltra 10:30 (circa 129 €). Trasferimento a Puerto Ayora (Santa Cruz). Pomeriggio: Tortuga Bay oppure Stazione Charles Darwin."],
["2027-04-28","Seymour Norte","Escursione in barca all'isola disabitata di Seymour Norte: corteggiamento delle fregate e sule dai piedi azzurri."],
["2027-04-29","Bartolomé","Escursione in giornata a Bartolomé: Pinnacle Rock e snorkeling guidato (pinguini, tartarughe, leoni marini)."],
["2027-04-30","Tartarughe giganti e tunnel di lava","Entroterra di Santa Cruz (El Chato o Primicias): tartarughe giganti libere e tunnel di lava."],
["2027-05-01","Rientro a Quito","Mattina al mercato del pesce di Puerto Ayora, poi Baltra. Avianca AV1683 (11:35, arrivo 16:10) o AV1631 (12:40, arrivo 17:15). LATAM LA1420 (10:45, arrivo 15:09) o LA1418 (13:14, arrivo 17:33)."],
["2027-05-02","Quito: ultimo giorno","Volo IB138 da Quito alle 18:00, scalo a Madrid di circa 2 ore."],
["2027-05-03","Arrivo a Roma","Arrivo a Roma Fiumicino (FCO) alle 15:30."]
];
const $=id=>document.getElementById(id);
const aperti=new Set();let dati=[],sporco=false;
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.toISOString().slice(0,10);

function conto(){
  const oggi=new Date(),p=new Date("2027-04-23T00:00"),f=new Date("2027-05-03T23:59");
  const n=Math.ceil((p-oggi)/864e5);
  $("conto").textContent=n>0?`Mancano ${n} giorni alla partenza`:oggi<=f?"Viaggio in corso":"Viaggio concluso";
}
function render(){
  const L=$("lista");
  if(!dati.length){L.className="vuoto";L.innerHTML='<p>Nessun giorno salvato.</p><button id="seed">Carica l\'itinerario iniziale</button>';$("seed").onclick=seed;return}
  L.className="";const oggi=iso(new Date());
  L.innerHTML="<ol>"+dati.map(g=>{
    const dt=new Date(g.data+"T12:00");
    const gs=dt.toLocaleDateString("it-IT",{weekday:"short"}),m=dt.toLocaleDateString("it-IT",{month:"short"});
    return `<li class="${g.data===oggi?"oggi":""}"><div class="d"><b>${dt.getDate()}</b>${gs} ${m}</div>
<details data-id="${g.id}" ${aperti.has(g.id)?"open":""}><summary>${esc(g.titolo)}<span class="riga">${esc(g.alloggio||"Alloggio da inserire")}</span></summary>
<label>Programma<textarea data-k="attivita">${esc(g.attivita)}</textarea></label>
<label>Alloggio (notte)<input data-k="alloggio" value="${esc(g.alloggio)}"></label>
<label>Trasporti<input data-k="trasporti" value="${esc(g.trasporti)}"></label>
<label>Note<textarea data-k="note">${esc(g.note)}</textarea></label></details></li>`}).join("")+"</ol>";
}
async function seed(){
  const b=writeBatch(db);
  SEED.forEach((s,i)=>b.set(doc(col,"g"+String(i+1).padStart(2,"0")),{data:s[0],titolo:s[1],attivita:s[2],alloggio:"",trasporti:"",note:""}));
  await b.commit();
}
$("lista").addEventListener("toggle",e=>{const id=e.target.dataset?.id;if(id)e.target.open?aperti.add(id):aperti.delete(id)},true);
$("lista").addEventListener("change",e=>{
  const id=e.target.closest("details")?.dataset.id,k=e.target.dataset.k;
  if(id&&k)setDoc(doc(col,id),{[k]:e.target.value},{merge:true});
});
$("lista").addEventListener("focusout",()=>setTimeout(()=>{if(sporco&&!$("lista").contains(document.activeElement)){sporco=false;render()}},50));
onSnapshot(col,{includeMetadataChanges:true},s=>{
  dati=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.id.localeCompare(b.id));
  if($("lista").contains(document.activeElement)&&document.activeElement.matches("input,textarea"))sporco=true;else render();
  const st=$("stato");st.className=s.metadata.fromCache?"off":"on";
  st.lastChild.textContent=s.metadata.fromCache?"Offline: salvo sul telefono":"Sincronizzato";
},e=>{$("lista").className="vuoto";$("lista").textContent="Errore di accesso ai dati: "+e.code});

const fmt=d=>d?d.slice(8)+"/"+d.slice(5,7):"";
const SEZ={
voli:{k:"data",vuoto:"Nessun volo salvato.",nuovo:"Aggiungi volo",
 campi:[["tratta","Tratta","text"],["data","Data","date"],["volo","Compagnia e numero volo","text"],["partenza","Partenza (ora)","time"],["arrivo","Arrivo (ora)","time"],["codice","Codice prenotazione","text"],["note","Note","area"]],
 tit:g=>g.tratta||"Volo da inserire",
 riga:g=>[fmt(g.data),g.volo,(g.partenza||g.arrivo)?`${g.partenza||"?"} → ${g.arrivo||"?"}`:""].filter(Boolean).join(" · "),
 seed:[
 {tratta:"Roma → Quito (via Madrid)",data:"2027-04-23",partenza:"07:35",arrivo:"16:10",note:"Scalo a Madrid di 1h50."},
 {tratta:"Quito → Baltra",data:"2027-04-27",volo:"Avianca AV1688",partenza:"09:15",arrivo:"10:30",note:"Costo circa 129 €."},
 {tratta:"Baltra → Quito",data:"2027-05-01",note:"Da scegliere. Avianca AV1683 11:35→16:10, AV1631 12:40→17:15. LATAM LA1420 10:45→15:09, LA1418 13:14→17:33."},
 {tratta:"Quito → Roma (via Madrid)",data:"2027-05-02",volo:"IB138",partenza:"18:00",arrivo:"15:30",note:"Arrivo a Fiumicino il 3 maggio. Scalo a Madrid di circa 2 ore."}]},
alberghi:{k:"checkin",vuoto:"Nessun albergo salvato.",nuovo:"Aggiungi albergo",
 campi:[["nome","Nome","text"],["localita","Località","text"],["indirizzo","Indirizzo","text"],["checkin","Check-in","date"],["checkout","Check-out","date"],["codice","Codice prenotazione","text"],["telefono","Telefono","text"],["note","Note","area"]],
 tit:g=>g.nome||"Albergo da inserire",
 riga:g=>[g.localita,(g.checkin||g.checkout)?`${fmt(g.checkin)||"?"} → ${fmt(g.checkout)||"?"}`:""].filter(Boolean).join(" · "),
 seed:[{localita:"Quito",checkin:"2027-04-23",checkout:"2027-04-27"},{localita:"Puerto Ayora (Santa Cruz)",checkin:"2027-04-27",checkout:"2027-05-01"},{localita:"Quito",checkin:"2027-05-01",checkout:"2027-05-02"}]}
};
const campoHtml=([k,l,t],g)=>t==="area"?`<label>${l}<textarea data-k="${k}">${esc(g[k])}</textarea></label>`:`<label>${l}<input type="${t}" data-k="${k}" value="${esc(g[k])}"></label>`;
for(const [nome,S] of Object.entries(SEZ)){
  const el=$("s-"+nome),c=collection(db,nome),op=new Set(),vuota=()=>Object.fromEntries(S.campi.map(f=>[f[0],""]));
  let dd=[],sp=false;
  const draw=()=>{
    el.innerHTML=(dd.length?dd.map(g=>`<details data-id="${g.id}" ${op.has(g.id)?"open":""}><summary>${esc(S.tit(g))}<span class="riga">${esc(S.riga(g))}</span></summary>${S.campi.map(f=>campoHtml(f,g)).join("")}<button class="del" data-del="${g.id}">Elimina</button></details>`).join(""):`<p class="vuoto">${S.vuoto}</p><p class="vuoto"><button data-seed>Carica dall'itinerario</button></p>`)+`<p><button data-add>${S.nuovo}</button></p>`;
  };
  el.addEventListener("toggle",e=>{const id=e.target.dataset?.id;if(id)e.target.open?op.add(id):op.delete(id)},true);
  el.addEventListener("change",e=>{const id=e.target.closest("details")?.dataset.id,k=e.target.dataset.k;if(id&&k)setDoc(doc(c,id),{[k]:e.target.value},{merge:true})});
  el.addEventListener("click",async e=>{
    const b=e.target.closest("button");if(!b)return;
    if("add"in b.dataset){const id="x"+Date.now();op.add(id);await setDoc(doc(c,id),vuota())}
    else if(b.dataset.del){if(confirm("Eliminare questa scheda?"))deleteDoc(doc(c,b.dataset.del))}
    else if("seed"in b.dataset){const w=writeBatch(db);S.seed.forEach((x,i)=>w.set(doc(c,"s"+i),{...vuota(),...x}));await w.commit()}
  });
  el.addEventListener("focusout",()=>setTimeout(()=>{if(sp&&!el.contains(document.activeElement)){sp=false;draw()}},50));
  onSnapshot(c,s=>{
    dd=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a[S.k]||"~").localeCompare(b[S.k]||"~"));
    if(el.contains(document.activeElement)&&document.activeElement.matches("input,textarea"))sp=true;else draw();
  },e=>{el.innerHTML='<p class="vuoto">Errore di accesso ai dati: '+e.code+'</p>'});
}
$("tab").addEventListener("click",e=>{
  const t=e.target.dataset.t;if(!t)return;
  document.querySelectorAll("#tab button").forEach(b=>b.setAttribute("aria-selected",b.dataset.t===t));
  ["programma","voli","alberghi"].forEach(n=>$("s-"+n).hidden=n!==t);
  scrollTo(0,0);
});
conto();
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
